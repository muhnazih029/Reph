name: reph

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: reph
      POSTGRES_PASSWORD: reph
      POSTGRES_DB: reph
    volumes:
      - reph_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reph -d reph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reph_pgdata:
